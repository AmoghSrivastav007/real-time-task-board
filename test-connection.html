<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CORS Connection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            font-size: 16px; 
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: #007bff;
            color: white;
        }
        button:hover { background: #0056b3; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 CORS Connection Test</h1>
    <p>This page tests if your localhost can connect to the Render backend.</p>
    
    <div>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <button onclick="testLogin()">Test Login API</button>
        <button onclick="clearCache()">Clear Cache & Reload</button>
    </div>

    <div id="results"></div>

    <script>
        const API_URL = 'https://real-time-task-board-ith5.onrender.com';
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        async function testHealth() {
            results.innerHTML = '';
            addResult('🔄 Testing health endpoint...', 'info');
            
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                addResult(`✅ Health check successful!<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                addResult(`Response headers:<br><pre>${JSON.stringify([...response.headers.entries()], null, 2)}</pre>`, 'info');
            } catch (error) {
                addResult(`❌ Health check failed: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            results.innerHTML = '';
            addResult('🔄 Testing login endpoint with OPTIONS (CORS preflight)...', 'info');
            
            try {
                // First test OPTIONS (preflight)
                const optionsResponse = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': window.location.origin,
                        'Access-Control-Request-Method': 'POST'
                    }
                });
                
                addResult(`✅ OPTIONS request successful! CORS is configured correctly.`, 'success');
                addResult(`CORS Headers:<br><pre>${JSON.stringify([...optionsResponse.headers.entries()].filter(([k]) => k.includes('access-control')), null, 2)}</pre>`, 'info');
                
                // Now test actual POST
                addResult('🔄 Testing actual POST request...', 'info');
                const postResponse = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'test123'
                    })
                });
                
                if (postResponse.ok) {
                    addResult(`✅ POST request successful!`, 'success');
                } else {
                    const errorData = await postResponse.json();
                    addResult(`⚠️ POST request reached server but returned error (this is expected for invalid credentials):<br><pre>${JSON.stringify(errorData, null, 2)}</pre>`, 'info');
                    addResult(`✅ The important thing is: No CORS error! Connection works!`, 'success');
                }
            } catch (error) {
                addResult(`❌ Request failed: ${error.message}`, 'error');
                addResult(`This might be a CORS issue. Try clearing your browser cache.`, 'error');
            }
        }

        function clearCache() {
            addResult('🔄 Clearing cache and reloading...', 'info');
            // Clear localStorage
            localStorage.clear();
            sessionStorage.clear();
            
            // Force reload without cache
            setTimeout(() => {
                window.location.reload(true);
            }, 500);
        }

        // Auto-run health check on load
        window.addEventListener('load', () => {
            addResult(`📍 Current origin: ${window.location.origin}`, 'info');
            addResult(`🎯 Target API: ${API_URL}`, 'info');
        });
    </script>
</body>
</html>
